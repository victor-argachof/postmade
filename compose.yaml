services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postmade
      POSTGRES_USER: postmade
      POSTGRES_PASSWORD: postmade_dev
    ports:
      - "5432:5432"
    volumes:
      - postmade_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postmade -d postmade"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - postmade_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postmade:postmade_dev@postgres:5432/postmade
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM: Postmade <no-reply@postmade.local>
      CORS_ORIGINS: http://localhost:5173
      COOKIE_SECURE: "false"
      SWAGGER_ENABLED: "true"
    ports:
      - "3000:3000"
      - "5555:5555"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: pnpm --filter @postmade/api dev

  web:
    image: node:22-alpine
    profiles: ["full"]
    working_dir: /app
    command: corepack pnpm --filter @postmade/web dev --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    environment:
      VITE_API_URL: http://localhost:3000/api/v1

volumes:
  postmade_postgres:
  postmade_redis:
